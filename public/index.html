<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="profile-card">
                <img id="company-logo" class="avatar" src="#" alt="Logo saep">
                <h1>SAEP Chef's</h1>
            </div>
            <div class="stats">
                <div>
                    <strong id="total-activities">0</strong>
                    <span> Receitas </span>
                </div>
            </div>

            <footer class="sidebar-footer">
                <h2> Saep Chefs </h2>
                <div class="sociais">
                    <img src="svg/instagram.svg" alt="Instagram">
                    <img src="svg/tiktok.svg" alt="TikTok">
                    <img src="svg/youtube.svg" alt="YouTube">

                </div>
                <span>Copyright-2024</span>
            </footer>
        </aside>
        <main class="content">
            <header class="topbar">
                <button id="auth-btn" class="btn-dark">Login</button>
            </header>
            <nav class="filters" id="filters">
                <button data-type="Doce">Doce</button>
                <button data-type="Salgado">Salgado</button>
                <button data-type="Assado">Assado</button>
            </nav>

            <section id="activity-form-section" class="activity-form hidden">
                <h2>Crie sua Receita</h2>

                <div class="form-grid">
                    <div>

                        <label for="receita-type">Titulo da Receita: </label>
                        <input aria-placeholder="tittle-receita" id="tittle-receita">

                    </div>
                    <div>
                        <label>
                            Adicione a foto do prato!
                            <input type="file" id="upload-image" accept="image/*">
                        </label>
                    </div>
                    <div>
                        <label>
                            Origem da receita
                            <input aria-placeholder="origin-receita" id="origin-receita">
                        </label>
                    </div>
                </div>
                <button id="create-activity" class="btn-dark">Cadastrar receita</button>
            </section>
            <section id="receitas-list" class="receitas-list">
                <!-- lista de atividades publicadas será renderizada aqui via JS -->
            </section>
            <div id="pagination" class="pagination">
                <!-- botões de paginação serão renderizados aqui via JAVASCRIPT !! -->
            </div>
        </main>
    </div>

    <template id="activity-card-template">
        <article class="activity-card">

            <div class="activity-header">
                <!-- !!! por enquanto é para ficar vazio -->
                <h3 class="activity-title"></h3>
                <time datetime="activity-date"></time>
            </div>

            <div class="activity-body">

                <img class="activity-avatar" alt="Foto do usuário" />

                <div>
                    <strong class="activity-user"></strong>

                    <div class="metrics">
                        <!-- MÉTRICA 1 (pronta — use como modelo) -->
                        <p><span class="distance"></span><small>Distância</small></p>
                        <p><span class="duration"></span><small>Duração</small></p>
                        <p><span class="co2"></span><small>CO₂ evitado</small></p>

                    </div>
                </div>

                <div class="actions">

                    <button class="fav-btn" type="reset">TESTE</button>
                    <span class="likes-count">0</span>
                    <button class="comment-btn">💬</button>
                    <span class="comments-count">0</span>
                </div>

            </div>

            <div class="comment-box hidden">

                <input class="comment-input" placeholder="Escreva um comentario..">
                <button class="send-comment">Enviar</button>
                <small class="error">Erro</small>
            </div>

        </article>
    </template>
</body>
